<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post-Test: CSS Internal</title>
    <!-- CSS internal: ditulis di dalam tag style pada bagian head -->
    <style>
        h1 {
            color: blue;
            text-align: center;
        }
        p {
            color: green;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <h1>Contoh CSS Internal</h1>
    <p>Paragraf pertama mengikuti aturan p pada tag style.</p>
    <p>Paragraf kedua juga mengikuti aturan yang sama.</p>
</body>
</html>
