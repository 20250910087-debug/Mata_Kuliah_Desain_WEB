<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post-Test: CSS Inline</title>
</head>
<body>
    <!-- CSS inline: ditulis langsung pada tag melalui atribut style -->
    <h1 style="color: blue; text-align: center;">Contoh CSS Inline</h1>
    <p style="color: green; font-size: 18px;">Gaya paragraf ini ditulis langsung pada tag p.</p>
    <p>Paragraf ini tidak diberi gaya, sehingga tampil seperti bawaan browser.</p>
</body>
</html>
